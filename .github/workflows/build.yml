
name: build

on:
  pull_request:
  merge_group:

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v2
        with:
          submodules: 'true'

      - name: Build
        run: cargo build

  build-linux:
    continue-on-error: true
    strategy:
      matrix:
        os: [ubuntu-24.04-arm, ubuntu-24.04]

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v2
        with:
          submodules: 'true'

      - name: Build
        run: cargo build
