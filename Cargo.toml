[package]
name = "overlay"
version = "0.1.0"
edition = "2024"

[dependencies] 
bytemuck = "1.25.2"
log = "0.4.34"
piet = {version="0.6.2", features = ["image"]}
piet-tiny-skia = "0.2.3"
tiny-skia = "0.11.4"
raqote = "0.8.5"
stderrlog = "0.6.0"
winit = "0.30.13"
softbuffer = "0.4.8"
tokio = { version = "1.50.0", features = ["io-util", "io-std", "rt"] }
serde_json = "1.0.151"
serde = {version = "1.0.229", features = ["derive"] }
base64 = "0.23.1"
image = "0.25.10"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = ["Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "linux")'.dependencies]
wayland-client = "0.31.14"
smithay-client-toolkit = "0.21.1" 
